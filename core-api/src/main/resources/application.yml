server:
  port: 8080

spring:
  application:
    name: core-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algoadda_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

algoadda:
  jwt:
    secret: ${JWT_SECRET:algoadda-super-secure-jwt-secret-key-that-is-at-least-256-bits-long-and-cryptographically-sound}
    access-token-validity-minutes: ${JWT_ACCESS_VALIDITY:15}
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY:7}
  aws:
    s3:
      bucket-name: ${S3_BUCKET_NAME:algoadda-bot-artifacts}
      region: ${AWS_REGION:ap-south-1}
    ses:
      region: ${AWS_REGION:ap-south-1}
      from-email: ${SES_FROM_EMAIL:noreply@algoadda.com}
  app-url: ${APP_URL:http://localhost:3000}
  backtest-service:
    url: ${BACKTEST_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-retries: 2
  official-seller-email: ${OFFICIAL_SELLER_EMAIL:official@algoadda.com}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_dummyKeyId}
    key-secret: ${RAZORPAY_KEY_SECRET:dummyKeySecret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummyWebhookSecret}
  rate-limit:
    bot-upload:
      capacity: ${RATE_LIMIT_BOT_UPLOAD_CAPACITY:10}
      window-minutes: ${RATE_LIMIT_BOT_UPLOAD_WINDOW_MINUTES:60}

logging:
  level:
    root: INFO
    com.algoadda.core: DEBUG
