server:
  port: 8080

spring:
  application:
    name: core-api

  main:
    lazy-initialization: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algoadda_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
logging:
  level:
    root: INFO
    com.algoadda.core: DEBUG
