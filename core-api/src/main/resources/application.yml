server:
  port: 8080

spring:
  application:
    name: core-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/algoadda_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

algoadda:
  jwt:
    secret: ${JWT_SECRET:algoadda-super-secure-jwt-secret-key-that-is-at-least-256-bits-long-and-cryptographically-sound}
    access-token-validity-minutes: ${JWT_ACCESS_VALIDITY:15}
    refresh-token-validity-days: ${JWT_REFRESH_VALIDITY:7}

logging:
  level:
    root: INFO
    com.algoadda.core: DEBUG
