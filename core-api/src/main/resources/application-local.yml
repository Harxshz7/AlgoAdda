spring:
  datasource:
    url: jdbc:h2:mem:algoadda_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

algoadda:
  jwt:
    secret: algoadda-super-secure-jwt-secret-key-that-is-at-least-256-bits-long-and-cryptographically-sound
    access-token-validity-minutes: 15
    refresh-token-validity-days: 7
  aws:
    s3:
      bucket-name: test-bucket
      region: ap-south-1
  backtest-service:
    url: http://localhost:8000
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-retries: 2
